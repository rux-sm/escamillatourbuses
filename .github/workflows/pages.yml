name: pages

# A push to main publishes the site. The check job runs first and the deploy
# happens only if it passes; a failing push stays in git and the last good
# deployment keeps serving. Any other branch runs the check alone.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node tools/check.mjs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The site is the committed tree minus what only works on it.
      - uses: actions/checkout@v7
      - run: rm -rf .git .github .githooks .claude tools package.json AGENTS.md CLAUDE.md README.md .gitignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
